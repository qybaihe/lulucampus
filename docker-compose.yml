services:
  api:
    build: .
    environment:
      ONEMORE_DATABASE_URL: postgresql+psycopg://onemore:onemore@postgres:5432/onemore
      ONEMORE_REDIS_URL: redis://redis:6379/0
      ONEMORE_CELERY_BROKER_URL: redis://redis:6379/1
      ONEMORE_CELERY_RESULT_BACKEND: redis://redis:6379/2
      ONEMORE_HERMES_MODE: real
      ONEMORE_HERMES_AGENT_MODE: sidecar
      ONEMORE_HERMES_AGENT_URL: http://hermes-agent:8642
      ONEMORE_CAMPUS_MCP_URL: http://api:8000/internal/campus-mcp
      ONEMORE_ADMIN_TOKEN: local-admin
      ONEMORE_AUTO_CREATE_SCHEMA: "false"
      ONEMORE_CAST_DRIVER_ENABLED: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: uv run celery -A onemore.tasks.celery_app:celery_app worker -l INFO
    environment: &backend-env
      ONEMORE_DATABASE_URL: postgresql+psycopg://onemore:onemore@postgres:5432/onemore
      ONEMORE_REDIS_URL: redis://redis:6379/0
      ONEMORE_CELERY_BROKER_URL: redis://redis:6379/1
      ONEMORE_CELERY_RESULT_BACKEND: redis://redis:6379/2
      ONEMORE_HERMES_MODE: real
      ONEMORE_HERMES_AGENT_MODE: sidecar
      ONEMORE_HERMES_AGENT_URL: http://hermes-agent:8642
      ONEMORE_CAMPUS_MCP_URL: http://api:8000/internal/campus-mcp
      ONEMORE_ADMIN_TOKEN: local-admin
      ONEMORE_CAST_DRIVER_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy

  beat:
    build: .
    command: uv run celery -A onemore.tasks.celery_app:celery_app beat -l INFO
    environment: *backend-env
    depends_on:
      - worker

  hermes-agent:
    build: .
    command: uv run uvicorn onemore.hermes.agent_server:app --host 0.0.0.0 --port 8642
    environment:
      <<: *backend-env
      ONEMORE_CAMPUS_MCP_URL: http://api:8000/internal/campus-mcp
    ports:
      - "8642:8642"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onemore
      POSTGRES_USER: onemore
      POSTGRES_PASSWORD: onemore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onemore"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
