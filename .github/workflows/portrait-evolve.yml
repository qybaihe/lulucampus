name: portrait-evolve

on:
  push:
    paths:
      - "lulu-portrait-evolve/**"
      - ".github/workflows/portrait-evolve.yml"
  pull_request:
    paths:
      - "lulu-portrait-evolve/**"
      - ".github/workflows/portrait-evolve.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lulu-portrait-evolve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
