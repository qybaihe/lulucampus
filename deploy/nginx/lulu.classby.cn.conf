# 噜噜成局 · lulu.classby.cn
# HTTP template. Live server file is mutated by:
#   sudo certbot --nginx -d lulu.classby.cn
# SPA is built with --base /onemore/; API is same-origin /onemore/api/.

server {
    listen 80;
    listen [::]:80;
    server_name lulu.classby.cn;

    client_max_body_size 256m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        return 301 /onemore/;
    }

    location = /onemore {
        return 301 /onemore/;
    }

    location /onemore/api/ {
        proxy_pass http://127.0.0.1:18100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $onemore_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /onemore/index.html {
        alias /opt/onemore/web-dist/index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /onemore/ {
        alias /opt/onemore/web-dist/;
        index index.html;
        try_files $uri $uri/ /onemore/index.html;
    }
}
