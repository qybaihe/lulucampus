name: OneMore
options:
  bundleIdPrefix: com.onemore.campus
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  OneMore:
    type: application
    platform: iOS
    sources:
      - path: OneMore
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: ONE MORE
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: OneMore/Resources/OneMore.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.onemore.campus.dev
          INFOPLIST_FILE: Config/Info-Debug.plist
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.onemore.campus
          INFOPLIST_FILE: Config/Info-Release.plist
    scheme:
      testTargets:
        - OneMoreTests
        - OneMoreUITests
      gatherCoverageData: true
  OneMoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OneMoreTests
    dependencies:
      - target: OneMore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onemore.campus.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ONE MORE.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ONE MORE"
        BUNDLE_LOADER: "$(TEST_HOST)"
  OneMoreUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OneMoreUITests
    dependencies:
      - target: OneMore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onemore.campus.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OneMore
