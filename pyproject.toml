[project]
name = "onemore-server"
version = "0.1.0"
description = "差一个 · ONE MORE 业务服务与 Hermes 行动代理"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx[http2]>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "playwright>=1.49,<2",
  "qrcode[pil]>=8,<9",
  "redis>=6,<7",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
onemore-api = "onemore.main:run"
onemore-seed = "onemore.scripts.seed:main"
onemore-ingest-competitions = "onemore.scripts.ingest_competitions:main"
onemore-generate-capabilities = "onemore.scripts.generate_capabilities:main"
onemore-export-openapi = "onemore.scripts.export_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onemore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
